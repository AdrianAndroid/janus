appId: com.janus.asaf
productName: Janus
copyright: Copyright © 2026 asaf
directories:
  buildResources: build
  output: release
files:
  - 'out/**'
  - 'package.json'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.npm-cache,.git}'

# Disk Usage remote Python helper (read at runtime, never bundled into JS).
extraResources:
  - from: resources/disk-usage
    to: disk-usage

# Single source icon (build/icon.png / build/icon.icns); other formats are derived.
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # ▶ CODE SIGNING (currently OFF → unsigned build).
  # To enable signed + notarized builds (no Gatekeeper warning, working mac
  # auto-update): (1) get an Apple Developer ID cert, (2) remove the line below,
  # (3) add the secrets/notarize block — see README "Kod imzalama".
  identity: null
# notarize:
#   teamId: YOUR_TEAM_ID
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}

linux:
  icon: build/icon.png
  category: Development
  maintainer: Asaf Üdürgücü <asafudurgucu1@gmail.com>
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}.${ext}

# Auto-update channel — GitHub Releases.
# In GitHub Actions, owner/repo are auto-detected from GITHUB_REPOSITORY, so no
# hardcoding is needed. For LOCAL publishing, add a git remote (origin) pointing
# at your repo, or uncomment owner/repo below.
publish:
  provider: github
  # owner: your-github-username
  # repo: janus

npmRebuild: false
